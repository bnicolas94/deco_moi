function buildHero() {
  const socialesContainer = document.getElementById('sociales-strips');
  const comercialesContainer = document.getElementById('comerciales-strips');
  
  events.sociales.forEach(ev => {
    const strip = document.createElement('div');
    strip.className = 'hero-strip';
    strip.style.background = ev.gradient;
    strip.style.width = `calc(100% / ${events.sociales.length})`;
    socialesContainer.appendChild(strip);
  });
  
  events.comerciales.forEach(ev => {
    const strip = document.createElement('div');
    strip.className = 'hero-strip';
    strip.style.background = ev.gradient;
    strip.style.width = `calc(100% / ${events.comerciales.length})`;
    comercialesContainer.appendChild(strip);
  });
}

// EVENTS GRID
function buildEvents(category) {
  const grid = document.getElementById('events-grid');
  grid.innerHTML = '';
  const categoryEvents = category === 'sociales' ? events.sociales : events.comerciales;
  categoryEvents.forEach(ev => {
    const btn = document.createElement('div');
    btn.className = 'event-btn';
    btn.style.background = ev.gradient;
    btn.innerHTML = `<div class="overlay"><span>${ev.name}</span></div>`;
    btn.onclick = () => openStyles(ev);
    grid.appendChild(btn);
  });
  window.currentCategory = category;
}

function openStyles(ev) {
  currentEvent = ev;
  hideAll();
  document.getElementById('styles-section').classList.remove('hidden');
  document.getElementById('styles-title').textContent = `Estilos para ${ev.name}`;
  const styles = stylesData[ev.id] || stylesData.default;
  const grid = document.getElementById('styles-grid');
  grid.innerHTML = '';
  styles.forEach(s => {
    const btn = document.createElement('div');
    btn.className = 'style-btn';
    btn.style.background = s.color;
    btn.innerHTML = `<div class="overlay"><span>${s.name}</span></div>`;
    btn.onclick = () => openProducts(s);
    grid.appendChild(btn);
  });
  
  // Agregar botón "Ver Todos" al final
  const verTodosBtn = document.createElement('button');
  verTodosBtn.className = 'flex items-center justify-center gap-2 text-sm text-[#8b7355] border border-[#8b7355] px-6 py-3 rounded-lg hover:bg-[#8b7355] hover:text-white transition mt-4 mx-auto';
  verTodosBtn.innerHTML = `<i data-lucide="grid-3x3" class="w-4 h-4"></i> Ver Todos`;

  const buttonContainer = document.createElement('div');

  buttonContainer.appendChild(verTodosBtn);
  grid.appendChild(buttonContainer);
  
  lucide.createIcons();
  window.scrollTo(0, 0);
}

  const products = productsData[style.id] || [{ id: 'gen1', name: 'Producto 1', price: 1500, img1Color: '#dfe6e9', img2Color: '#b2bec3' }];
  const grid = document.getElementById('products-grid');
  grid.innerHTML = '';
  products.forEach(p => {
    const card = document.createElement('div');
    card.className = 'product-card bg-white shadow-md';
    const imgUrl = productImages[p.category] || productImages.chocolates;
    card.innerHTML = `
      <div class="relative aspect-square overflow-hidden">

  });

  window.scrollTo(0, 0);

        <div id="total-box" class="bg-[#f9f6f1] rounded-xl p-4 space-y-1">
          <p class="text-xs text-gray-500 uppercase tracking-wide">Total estimado</p>
          <p class="text-xl font-semibold" id="total-normal">$${product.price.toLocaleString()}</p>
          <p class="text-md text-[#8b7355]" id="total-transfer">$${transferPrice.toLocaleString()} <span class="text-xs">con transferencia</span></p>
          <p id="discount-badge" class="text-xs text-green-700 hidden"></p>
        </div>

        <div class="flex gap-3 pt-2">
          <button class="flex-1 bg-[#2c2c2c] text-white py-3 rounded-lg font-medium hover:bg-[#1a1a1a] transition">Comprar ahora</button>
          <button class="flex-1 border-2 border-[#2c2c2c] text-[#2c2c2c] py-3 rounded-lg font-medium hover:bg-[#2c2c2c] hover:text-white transition">Agregar al carrito</button>
        </div>
      </div>
    </div>`;

  // Design selection functionality
  document.querySelectorAll('.design-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.design-btn').forEach(b => b.classList.remove('border-[#8b7355]', 'text-[#8b7355]', 'bg-[#f5f0e8]'));
      this.classList.add('border-[#8b7355]', 'text-[#8b7355]', 'bg-[#f5f0e8]');
      document.getElementById('selected-design').value = this.dataset.design;
    });
  });

  // Set first design as selected
  document.querySelector('.design-btn[data-design="1"]').classList.add('border-[#8b7355]', 'text-[#8b7355]', 'bg-[#f5f0e8]');

  window._currentProduct = product;
  window._transferDiscount = transferDiscount;
  lucide.createIcons();
  window.scrollTo(0, 0);
}

function changeQty(delta) {
  const input = document.getElementById('qty-input');
  let val = parseInt(input.value) || 1;
  val = Math.max(1, val + delta);
  input.value = val;
  updateTotal();
}

function updateTotal() {
  const qty = Math.max(1, parseInt(document.getElementById('qty-input').value) || 1);
  const product = window._currentProduct;
  let unitPrice = product.price;
  let volumeDiscount = 0;

  if (qty >= 50) { volumeDiscount = 0.05; }
  else if (qty >= 25) { volumeDiscount = 0.02; }

  const discountedUnit = Math.round(unitPrice * (1 - volumeDiscount));
  const transferUnit = Math.round(discountedUnit * (1 - window._transferDiscount));

  document.getElementById('unit-price').textContent = `$${discountedUnit.toLocaleString()}`;
  document.getElementById('transfer-price').innerHTML = `$${transferUnit.toLocaleString()} <span class="text-sm font-light">con transferencia</span>`;

  document.getElementById('total-normal').textContent = `$${(discountedUnit * qty).toLocaleString()}`;
  document.getElementById('total-transfer').innerHTML = `$${(transferUnit * qty).toLocaleString()} <span class="text-xs">con transferencia</span>`;

  const badge = document.getElementById('discount-badge');
  if (volumeDiscount > 0) {
    badge.classList.remove('hidden');
    badge.textContent = `🎉 Descuento por cantidad: ${(volumeDiscount * 100).toFixed(0)}% aplicado (${qty}+ unidades)`;
  } else {
    badge.classList.add('hidden');
  }
}

// NAVIGATION
function hideAll() {
  ['hero-section','events-section','styles-section','products-section','detail-section'].forEach(id => {
    document.getElementById(id).classList.add('hidden');
  });
}

function scrollToCategory(category) {
  hideAll();
  document.getElementById('events-section').classList.remove('hidden');
  buildEvents(category);
  lucide.createIcons();
  window.scrollTo(0, 0);
}

function goHome() {
  hideAll();
  document.getElementById('hero-section').classList.remove('hidden');
  window.scrollTo(0, 0);
}

function goToEvents() {
  hideAll();
  document.getElementById('events-section').classList.remove('hidden');
  window.scrollTo(0, 0);
}
