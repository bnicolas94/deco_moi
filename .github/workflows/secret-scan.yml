name: Verificacion de secretos

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-scan:
    name: Archivos y credenciales sensibles
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Buscar secretos y respaldos
        run: node scripts/check-secrets.mjs
